name: TVBrowser
options:
  bundleIdPrefix: com.xzhang
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TVBrowser:
    type: application
    platform: tvOS
    sources:
      - path: TVBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xzhang.tvbrowser
        PRODUCT_NAME: TVBrowser
        INFOPLIST_FILE: TVBrowser/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: TVBrowser/TVBrowser-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        # 在 Xcode 里选择你的 Apple ID 团队后会自动填上
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  TVBrowserUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: UITests
    dependencies:
      - target: TVBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xzhang.tvbrowser.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TVBrowser
        CODE_SIGN_STYLE: Automatic
schemes:
  TVBrowser:
    build:
      targets:
        TVBrowser: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TVBrowserUITests
    archive:
      config: Release
